<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Agujero Negro — Dos Perspectivas</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #fff; color: #111;
  font-family: 'Georgia', serif;
  max-width: 480px; margin: 0 auto;
  padding-bottom: 40px; overflow-x: hidden;
}
.header { border-bottom: 3px solid #111; padding: 14px 14px 10px; text-align: center; }
.header h1 { font-size: 1.0rem; font-weight: bold; }
.header p  { font-size: 0.59rem; color: #555; font-family: monospace; margin-top: 3px; }

.obs-switch { display: flex; border-bottom: 2px solid #111; }
.obs-btn {
  flex: 1; padding: 10px 6px 8px; border: none; background: #fff;
  cursor: pointer; text-align: center; border-right: 1px solid #111;
  transition: background .15s;
}
.obs-btn:last-child { border-right: none; }
.obs-btn.active { background: #111; color: #fff; }
.obs-icon  { font-size: 1.4rem; display: block; margin-bottom: 2px; }
.obs-label { font-size: 0.66rem; font-weight: bold; font-family: monospace; display: block; }
.obs-sub   { font-size: 0.54rem; font-family: monospace; color: #888; display: block; margin-top: 1px; }
.obs-btn.active .obs-sub { color: #aaa; }

/* sub-menu flight mode (only in ship view) */
#flightMenu {
  display: none;
  border-bottom: 2px solid #111;
  background: #f5f5f5;
}
#flightMenu.visible { display: flex; }
.fm-btn {
  flex: 1; padding: 7px 4px; border: none;
  background: transparent; cursor: pointer;
  font-size: 0.58rem; font-family: monospace;
  color: #555; border-right: 1px solid #ccc;
  text-align: center; transition: background .12s;
}
.fm-btn:last-child { border-right: none; }
.fm-btn.active { background: #333; color: #fff; }

/* zoom canvas */
.zoom-vp {
  width: 100%; overflow: hidden; background: #000;
  border-bottom: 2px solid #111; position: relative;
  touch-action: none; cursor: grab;
}
.zoom-vp:active { cursor: grabbing; }
.zoom-c { transform-origin: 0 0; will-change: transform; display: inline-block; }
canvas  { display: block; }
.zoom-hint {
  position: absolute; bottom: 6px; right: 8px;
  font-size: 0.52rem; font-family: monospace;
  color: rgba(255,255,255,0.3); pointer-events: none;
}

/* status bars */
.status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: #f5f5f5;
  border-bottom: 1px solid #ddd;
  font-family: monospace; font-size: 0.58rem;
}
.s-label { color: #777; min-width: 72px; }
.s-track { flex: 1; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
.s-fill  { height: 100%; border-radius: 4px; transition: width .06s; }
.s-val   { min-width: 48px; text-align: right; color: #333; }

/* formula */
.formula-panel {
  background: #f5f5f5; border-bottom: 1px solid #ddd;
  padding: 7px 12px; font-family: monospace; font-size: 0.59rem; line-height: 2;
}
.flabel {
  font-size: 0.52rem; text-transform: uppercase; letter-spacing: .1em; color: #888;
  border-bottom: 1px solid #e0e0e0; margin-bottom: 3px; padding-bottom: 2px;
}
.frow { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.fn   { color: #888; font-size: .52rem; min-width: 72px; }
.fv .r { color: #c0392b; font-weight: bold; }
.fv .b { color: #1a6fa8; font-weight: bold; }
.fv .g { color: #1e8449; font-weight: bold; }
.fv .o { color: #d35400; font-weight: bold; }
.fv .p { color: #6c3483; font-weight: bold; }

.info-box {
  padding: 9px 12px; font-size: 0.61rem; line-height: 1.75;
  border-bottom: 1px solid #eee; min-height: 60px;
}
.info-box .it { font-weight: bold; font-size: .64rem; margin-bottom: 3px; }

.legend {
  display: flex; flex-wrap: wrap; gap: 5px 10px;
  padding: 5px 12px 7px; font-size: 0.56rem; font-family: monospace;
}
.li { display: flex; align-items: center; gap: 4px; }
.ld { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #555; flex-shrink: 0; }

.ctrl-row { display: flex; gap: 6px; padding: 8px 12px; }
.btn {
  flex: 1; background: #fff; border: 2px solid #111; color: #111;
  padding: 8px 4px; border-radius: 3px; font-size: 0.6rem;
  font-family: monospace; cursor: pointer; text-align: center;
  transition: background .12s, color .12s;
}
.btn:active, .btn.on { background: #111; color: #fff; }

.note {
  margin: 10px 12px 0; border: 2px solid #111; border-left: 5px solid #111;
  border-radius: 3px; padding: 10px 12px; font-size: 0.59rem;
  font-family: monospace; line-height: 1.8; background: #fffde7;
}
.note strong { font-size: .62rem; }
</style>
</head>
<body>

<div class="header">
  <h1>Agujero Negro — Dos Perspectivas</h1>
  <p>Corrimiento al rojo · Congelamiento · Aberración · Blueshift extremo</p>
</div>

<div class="obs-switch">
  <button class="obs-btn active" id="ob0" onclick="setObs(0)">
    <span class="obs-icon">🔭</span>
    <span class="obs-label">OBSERVADOR LEJANO</span>
    <span class="obs-sub">Ve la nave frenarse y desvanecerse</span>
  </button>
  <button class="obs-btn" id="ob1" onclick="setObs(1)">
    <span class="obs-icon">🚀</span>
    <span class="obs-label">DENTRO DE LA NAVE</span>
    <span class="obs-sub">Escoge modo de vuelo</span>
  </button>
</div>

<!-- FLIGHT MODE SUB-MENU (visible only in ship view) -->
<div id="flightMenu">
  <button class="fm-btn" id="fm0" onclick="setFlight(0)">🔥 Motores a tope<br><small style="font-size:0.5rem;opacity:.7">(Estacionario sobre Rs)</small></button>
  <button class="fm-btn active" id="fm1" onclick="setFlight(1)">🌀 Caída Libre<br><small style="font-size:0.5rem;opacity:.7">(Inercial — por defecto)</small></button>
</div>

<div class="zoom-vp" id="zvp">
  <div class="zoom-c" id="zc">
    <canvas id="cv" width="460" height="380"></canvas>
  </div>
  <div class="zoom-hint">🤏 Pellizca · Arrastra para zoom</div>
</div>

<div class="status-bar">
  <span class="s-label" id="sl1">Velocidad:</span>
  <div class="s-track"><div class="s-fill" id="sf1" style="width:0%;background:#c0392b;"></div></div>
  <span class="s-val" id="sv1">0.00c</span>
</div>
<div class="status-bar" style="border-bottom:2px solid #ddd;">
  <span class="s-label" id="sl2">Corrimiento:</span>
  <div class="s-track"><div class="s-fill" id="sf2" style="width:0%;background:#e67e22;"></div></div>
  <span class="s-val" id="sv2">656nm</span>
</div>

<div class="formula-panel" id="fPanel"></div>
<div class="info-box"       id="iBox"></div>
<div class="legend"         id="legBox"></div>

<div class="ctrl-row">
  <button class="btn" onclick="doReset()">↺ Reset</button>
  <button class="btn on" id="btnPlay" onclick="doToggle()">⏸ Pausar</button>
  <button class="btn" onclick="doStep()">⏭ Avanzar</button>
</div>

<div class="note" id="noteEl"></div>

<script>
/* ══════════════════════════════════════
   ZOOM / PAN
══════════════════════════════════════ */
const zvp=document.getElementById('zvp'), zc=document.getElementById('zc');
const CV=document.getElementById('cv');
const W=460, H=380;
let sc=1,ox=0,oy=0,ld=0,isd=false,dsx=0,dsy=0,dox=0,doy=0;
function apT(){
  sc=Math.max(0.4,Math.min(6,sc));
  ox=Math.max(Math.min(0,ox),Math.min(0,-(W*sc-zvp.clientWidth)));
  oy=Math.max(Math.min(0,oy),Math.min(0,-(H*sc-zvp.clientHeight)));
  zc.style.transform=`translate(${ox}px,${oy}px) scale(${sc})`;
  zvp.style.height=Math.max(H*sc,200)+'px';
}
zvp.addEventListener('touchstart',e=>{
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ld=Math.sqrt(dx*dx+dy*dy);}
  else{isd=true;dsx=e.touches[0].clientX;dsy=e.touches[0].clientY;dox=ox;doy=oy;}
},{passive:true});
zvp.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy),r=d/ld,ps=sc;sc*=r;
    const rect=zvp.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    ox-=(mx-rect.left-ox)*(sc-ps)/ps;oy-=(my-rect.top-oy)*(sc-ps)/ps;ld=d;apT();
  }else if(isd){ox=dox+(e.touches[0].clientX-dsx);oy=doy+(e.touches[0].clientY-dsy);apT();}
},{passive:false});
zvp.addEventListener('touchend',()=>{isd=false;},{passive:true});
zvp.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=zvp.getBoundingClientRect(),ps=sc;sc*=e.deltaY<0?1.12:0.9;
  ox-=(e.clientX-rect.left-ox)*(sc-ps)/ps;oy-=(e.clientY-rect.top-oy)*(sc-ps)/ps;apT();
},{passive:false});
zvp.addEventListener('mousedown',e=>{isd=true;dsx=e.clientX;dsy=e.clientY;dox=ox;doy=oy;});
window.addEventListener('mousemove',e=>{if(!isd)return;ox=dox+(e.clientX-dsx);oy=doy+(e.clientY-dsy);apT();});
window.addEventListener('mouseup',()=>{isd=false;});
apT();

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
const ctx=CV.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* Redshift factor √(1 − Rs/r) */
function rfactor(r,Rs){ return Math.sqrt(Math.max(0, 1 - Rs/r)); }

/* Visible-spectrum wavelength → CSS rgb */
function wl2rgb(nm){
  nm=clamp(nm,380,780);
  let r=0,g=0,b=0;
  if(nm<440){r=(440-nm)/60;b=1;}
  else if(nm<490){g=(nm-440)/50;b=1;}
  else if(nm<510){g=1;b=(510-nm)/20;}
  else if(nm<580){r=(nm-510)/70;g=1;}
  else if(nm<645){r=1;g=(645-nm)/65;}
  else{r=1;}
  const att=nm<420?0.3+(nm-380)/40*0.7:nm>700?0.3+(780-nm)/80*0.7:1;
  return [Math.round(r*255*att),Math.round(g*255*att),Math.round(b*255*att)];
}

/* Redshift factor → wavelength (1=480nm blue-white, 0=920nm IR) */
function rfToNm(f){ return lerp(920,480,clamp(f,0,1)); }

/* Redshift factor → rgba string */
function rfToColor(f,alpha=1){
  const nm=rfToNm(f);
  if(nm>750){
    const d=clamp((nm-750)/170,0,1);
    return `rgba(${Math.round(lerp(180,5,d))},0,0,${alpha*lerp(1,0.05,d)})`;
  }
  const [r,g,b]=wl2rgb(nm);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ══════════════════════════════════════
   STAR FIELD  (shared)
══════════════════════════════════════ */
const STARS=[];
for(let i=0;i<200;i++){
  STARS.push({
    x:Math.random()*W, y:Math.random()*H,
    r:0.4+Math.random()*1.4,
    twinkle:Math.random()*Math.PI*2,
    baseX:Math.random()*W, baseY:Math.random()*H,
    nmBase:440+Math.random()*160,
  });
}

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let obsMode=0, flightMode=1; // flightMode: 0=stationary, 1=freefall
let running=true, raf=null, tick=0;

/* Photon pulses for external view */
let photons=[];

/* ══════════════════════════════════════
   PERSPECTIVE 0 — EXTERNAL OBSERVER
   Three phases:
     Phase 1 [0, 0.55)  → approach + braking (expo-4 curve)
     Phase 2 [0.55,0.80) → frozen at horizon, alpha=1
     Phase 3 [0.80,1.00] → fade out linearly → 0
══════════════════════════════════════ */
const CYCLE=620;

/* Phase boundaries */
const P1_END=0.55, P2_END=0.80;

/* Map global p [0,1] to ship radial position rNorm [1→0] using expo-4 brake */
function shipRnorm(p){
  if(p>=P1_END) return 0.0002; // frozen
  const t=p/P1_END;        // 0→1 during approach
  return Math.max(0.0002, 1 - Math.pow(t,4)*0.9998);
}

function renderExternal(){
  const p=clamp(tick/CYCLE,0,1);

  /* ── determine phase ── */
  const phase= p<P1_END ? 1 : p<P2_END ? 2 : 3;
  const rNorm=shipRnorm(p);
  const Rs=72;
  const bhCX=W*0.60, bhCY=H/2;
  const r=Rs*(1+rNorm*5.0);
  const rfVal=rfactor(r,Rs);
  const apparentVel=clamp(rfVal*0.97,0,1);

  /* ship alpha: phase 1&2 = 1.0, phase 3 fades linearly */
  const fadeAlpha = phase<3 ? 1.0 : clamp(1-(p-P2_END)/(1.0-P2_END),0,1);

  /* ── BACKGROUND ── */
  ctx.fillStyle='#040408'; ctx.fillRect(0,0,W,H);
  STARS.forEach(s=>{
    s.twinkle+=0.012;
    const a=0.3+0.2*Math.sin(s.twinkle);
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });

  /* ── ACCRETION DISK ── */
  for(let i=4;i>=0;i--){
    const ri=Rs*(1.15+i*0.28);
    const al=[0.22,0.16,0.11,0.07,0.03][i];
    const hue=[28,20,14,8,4][i];
    const g=ctx.createRadialGradient(bhCX,bhCY,ri-Rs*0.1,bhCX,bhCY,ri+Rs*0.3);
    g.addColorStop(0,`hsla(${hue},95%,55%,0)`);
    g.addColorStop(0.4,`hsla(${hue},95%,55%,${al})`);
    g.addColorStop(1,`hsla(${hue},95%,28%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bhCX,bhCY,ri+Rs*0.3,0,Math.PI*2);ctx.fill();
  }

  /* ── BLACK HOLE ── */
  const gBH=ctx.createRadialGradient(bhCX,bhCY,Rs*0.9,bhCX,bhCY,Rs*2.5);
  gBH.addColorStop(0,'rgba(0,0,0,1)');gBH.addColorStop(0.55,'rgba(0,0,0,0.7)');gBH.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gBH;ctx.beginPath();ctx.arc(bhCX,bhCY,Rs*2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bhCX,bhCY,Rs,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,200,60,0.22)';ctx.lineWidth=1.5;ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs*1.5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='rgba(220,50,50,0.65)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs,0,Math.PI*2);ctx.stroke();

  /* ── SHIP TRAIL ── */
  const trailLen=30;
  for(let i=1;i<=trailLen;i++){
    const tp=Math.max(0, p - i*0.007);
    const tRnorm=shipRnorm(tp);
    const tr=Rs*(1+tRnorm*5.0);
    const tx=bhCX-tr, ty=bhCY;
    if(tx<bhCX-Rs*0.98){
      const trfV=rfactor(tr,Rs);
      const trailAlpha=clamp(trfV*0.45*(1-i/trailLen)*fadeAlpha,0,0.38);
      ctx.fillStyle=rfToColor(trfV,trailAlpha);
      ctx.beginPath();ctx.arc(tx,ty,2.2,0,Math.PI*2);ctx.fill();
    }
  }

  /* ── DRAW SHIP ── */
  const shipX=bhCX-r, shipY=bhCY;
  if(fadeAlpha>0.01 && shipX < bhCX-Rs*0.97){
    // engine glow
    const eg=ctx.createRadialGradient(shipX-16,shipY,0,shipX-16,shipY,18);
    eg.addColorStop(0,rfToColor(rfVal,fadeAlpha*0.65));eg.addColorStop(1,'transparent');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(shipX-16,shipY,18,0,Math.PI*2);ctx.fill();
    // halo
    const hg=ctx.createRadialGradient(shipX,shipY,0,shipX,shipY,24);
    hg.addColorStop(0,rfToColor(rfVal,fadeAlpha*0.3));hg.addColorStop(1,'transparent');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(shipX,shipY,24,0,Math.PI*2);ctx.fill();
    // body
    ctx.fillStyle=rfToColor(rfVal,fadeAlpha);
    ctx.strokeStyle=rfToColor(Math.min(rfVal+0.1,1),fadeAlpha*0.6);ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(shipX+14,shipY);ctx.lineTo(shipX-5,shipY-7);
    ctx.lineTo(shipX-12,shipY);ctx.lineTo(shipX-5,shipY+7);
    ctx.closePath();ctx.fill();ctx.stroke();
    // porthole
    if(rfVal>0.2){
      ctx.fillStyle=rfToColor(rfVal,fadeAlpha*0.5);
      ctx.beginPath();ctx.arc(shipX+2,shipY,3.5,0,Math.PI*2);ctx.fill();
    }
    /* wavelength label */
    if(rfVal>0.04 && fadeAlpha>0.1){
      const nm=Math.round(rfToNm(rfVal));
      ctx.fillStyle=rfToColor(rfVal,Math.min(1,fadeAlpha*1.5));
      ctx.font='7px monospace';ctx.textAlign='center';
      ctx.fillText(`λ≈${nm}nm`,shipX,shipY-20);
    }
    /* PHASE 2: FROZEN label (full opacity, static) */
    if(phase===2){
      ctx.fillStyle='rgba(220,55,40,0.95)';
      ctx.font='bold 8px monospace';ctx.textAlign='center';
      ctx.fillText('CONGELADO EN Rs',shipX,shipY-33);
      ctx.fillStyle='rgba(200,200,200,0.8)';ctx.font='6.5px monospace';
      ctx.fillText('t_coord → ∞',shipX,shipY-22);
      ctx.fillText('τ_nave continúa...',shipX,shipY-12);
    }
    /* PHASE 3: fading ghost label */
    if(phase===3 && fadeAlpha>0.05){
      ctx.fillStyle=`rgba(220,55,40,${fadeAlpha*0.85})`;
      ctx.font='bold 7px monospace';ctx.textAlign='center';
      ctx.fillText('DESVANECIENDO...',shipX,shipY-22);
    }
  }

  /* ── PHOTON PULSES ── */
  if(running && rfVal>0.02 && phase<3){
    const rate=Math.max(4, Math.round(36*rfVal));
    if(tick%rate===0){
      photons.push({
        x:shipX, y:shipY+lerp(-3,3,Math.random()),
        vx:1.5+rfVal*0.9,
        nm:rfToNm(rfVal),
        alpha:Math.min(1,rfVal*1.7),
        life:Math.ceil((W-shipX)/2.1)+5
      });
    }
  }
  for(let i=photons.length-1;i>=0;i--){
    const ph=photons[i]; ph.x+=ph.vx; ph.life--;
    const a=ph.alpha*(ph.life/(ph.life+5))*0.85;
    if(ph.nm>750){
      const d=clamp((ph.nm-750)/170,0,1);
      ctx.fillStyle=`rgba(${Math.round(lerp(170,0,d))},0,0,${a*lerp(1,0.08,d)})`;
    } else {
      const [r2,g2,b2]=wl2rgb(ph.nm);
      ctx.fillStyle=`rgba(${r2},${g2},${b2},${a})`;
    }
    ctx.beginPath();ctx.arc(ph.x,ph.y,1.5,0,Math.PI*2);ctx.fill();
    if(ph.life<=0||ph.x>W+10) photons.splice(i,1);
  }

  /* ── OBSERVER ICON ── */
  const obsX=W-22, obsY=H/2;
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(obsX,obsY,14,0,Math.PI*2);ctx.fill();
  ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('👁',obsX,obsY+6);
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='6px monospace';ctx.fillText('LEJANO',obsX,obsY-18);

  /* ── SPECTRUM STRIP ── */
  const bx=10,by=H-28,bw=W-20,bh=9;
  const sg=ctx.createLinearGradient(bx,0,bx+bw,0);
  sg.addColorStop(0,'rgba(80,80,255,0.85)');sg.addColorStop(0.18,'rgba(100,200,255,0.85)');
  sg.addColorStop(0.36,'rgba(255,255,255,0.85)');sg.addColorStop(0.54,'rgba(255,220,60,0.85)');
  sg.addColorStop(0.72,'rgba(255,80,20,0.85)');sg.addColorStop(0.88,'rgba(140,0,0,0.85)');
  sg.addColorStop(1,'rgba(10,0,0,0.7)');
  ctx.fillStyle=sg;ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  const ptr=bx+bw*clamp(1-rfVal*0.8,0,1);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(ptr-1,by-3,2,bh+6);
  ctx.fillStyle='rgba(180,180,180,0.55)';ctx.font='6px monospace';
  ctx.textAlign='left';ctx.fillText('← Azul',bx+2,by-5);
  ctx.textAlign='right';ctx.fillText('Rojo →',bx+bw-2,by-5);
  ctx.textAlign='center';ctx.fillText('Espectro recibido (Doppler gravitacional)',W/2,by+bh+10);

  /* horizon dashed line */
  ctx.strokeStyle='rgba(220,50,50,0.35)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(bhCX,18);ctx.lineTo(bhCX,H-40);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(220,50,50,0.55)';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText('Rs',bhCX,14);

  /* HUD */
  const nm=Math.round(rfToNm(rfVal));
  document.getElementById('sl1').textContent='Vel. aparente:';
  document.getElementById('sf1').style.width=(apparentVel*100).toFixed(1)+'%';
  document.getElementById('sf1').style.background=rfToColor(rfVal+0.1,1).replace(/,[\d.]+\)$/,')').replace('rgba','rgb');
  document.getElementById('sv1').textContent=(apparentVel*0.98).toFixed(2)+'c';
  document.getElementById('sl2').textContent='Longitud onda:';
  document.getElementById('sf2').style.width=(clamp(1-rfVal,0,1)*100).toFixed(0)+'%';
  document.getElementById('sf2').style.background=rfToColor(rfVal,1).replace(/,[\d.]+\)$/,')').replace('rgba','rgb');
  document.getElementById('sv2').textContent=nm+'nm';
}

   flightMode 1 = freefall (inertial)

/* ── Helper: draw accretion + BH core ── */
function drawBHCore(bx,by,Rs,shadowR){
  for(let i=4;i>=0;i--){
    const ri=Rs*(1.15+i*0.28),al=[0.28,0.20,0.13,0.08,0.04][i],hue=[28,20,14,8,4][i];
    const g=ctx.createRadialGradient(bx,by,ri-Rs*0.1,bx,by,ri+Rs*0.3);
    g.addColorStop(0,`hsla(${hue},95%,60%,0)`);
    g.addColorStop(0.4,`hsla(${hue},95%,55%,${al})`);
    g.addColorStop(1,`hsla(${hue},95%,30%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,ri+Rs*0.3,0,Math.PI*2);ctx.fill();
  }
  // shadow
  const sh=ctx.createRadialGradient(bx,by,shadowR*0.5,bx,by,shadowR);
  sh.addColorStop(0,'rgba(0,0,0,1)');sh.addColorStop(0.7,'rgba(0,0,0,0.92)');sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(bx,by,shadowR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bx,by,Rs,0,Math.PI*2);ctx.fill();
}

/* ── STATIONARY (engines on) ── */
function renderShipStationary(){
  const p=clamp(tick/CYCLE,0,1);
  const bhCX=W/2, bhCY=H/2;
  const Rs=60;
  // Fixed at r = 1.18·Rs → rfVal stays low but nonzero
  const r_stat=Rs*1.18;
  const rfStat=rfactor(r_stat,Rs);   // ≈ 0.395
  // blueshift for incoming photons: f_obs = f_emit / rfStat  (we see high energy)
  const blueBoost=1/Math.max(rfStat,0.01);  // ~2.5×

  /* ── BG: deepening blue/UV tint ── */
  ctx.fillStyle=`rgb(0,2,14)`; ctx.fillRect(0,0,W,H);

  /* ── STARS: gravitational lensing + blueshift, NO aberration (v=0) ── */
  STARS.forEach(s=>{
    s.twinkle+=0.014;
    // lensing: stars bend around BH — simulate by bending coords away from BH
    const dx=s.baseX-bhCX, dy=s.baseY-bhCY;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=dx/dist, ny=dy/dist;
    // deflection away from center (Einstein ring effect)
    const lensDeflect=clamp(Rs*2/(dist+Rs*0.5),0,1);
    const sx=s.baseX+nx*lensDeflect*30, sy=s.baseY+ny*lensDeflect*30;
    // blueshift: all stars shift toward UV/blue (strong grav redshift inverted)
    const rawNm=s.nmBase;
    const boostedNm=Math.max(360, rawNm/blueBoost); // compress toward blue
    let sc_r,sc_g,sc_b;
    if(boostedNm<395){sc_r=120;sc_g=0;sc_b=200;} // UV → violet
    else{[sc_r,sc_g,sc_b]=wl2rgb(boostedNm);}
    const bright=clamp(0.4+0.3*Math.sin(s.twinkle)+lensDeflect*0.4,0,1);
    ctx.fillStyle=`rgba(${sc_r},${sc_g},${sc_b},${bright})`;
    ctx.beginPath();ctx.arc(sx,sy,s.r*(1+lensDeflect*0.8),0,Math.PI*2);ctx.fill();
  });

  // Einstein ring (visible because we're hovering close)
  const ringPulse=1+0.04*Math.sin(tick*0.04);
  ctx.strokeStyle='rgba(180,160,255,0.55)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs*1.7*ringPulse,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(140,120,255,0.25)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs*2.0*ringPulse,0,Math.PI*2);ctx.stroke();

  drawBHCore(bhCX,bhCY,Rs, Rs*2.8);

  /* ── COCKPIT FRAME ── */
  ctx.strokeStyle='rgba(40,50,60,0.6)';ctx.lineWidth=4;
  const fr=14;
  [[fr,fr,fr+22,fr],[fr,fr,fr,fr+22],[W-fr,fr,W-fr-22,fr],[W-fr,fr,W-fr,fr+22],
   [fr,H-fr,fr+22,H-fr],[fr,H-fr,fr,H-fr-22],[W-fr,H-fr,W-fr-22,H-fr],[W-fr,H-fr,W-fr,H-fr-22]
  ].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});

  /* ── EXTERNAL OBSERVER WINDOW ── */
  const winW=124,winH=84,winX=12,winY=12;
  ctx.fillStyle='rgba(0,5,18,0.9)';ctx.fillRect(winX,winY,winW,winH);
  ctx.strokeStyle='rgba(180,160,255,0.7)';ctx.lineWidth=1.5;ctx.strokeRect(winX,winY,winW,winH);
  ctx.fillStyle='rgba(200,185,255,0.9)';ctx.font='6.5px monospace';ctx.textAlign='center';
  ctx.fillText('Observador Lejano',winX+winW/2,winY+11);

  // External clock spinning fast (gravitational time dilation)
  const extClockMult=Math.max(1,Math.round(blueBoost));
  const extAngle=tick*0.06*extClockMult;
  const ccX=winX+22,ccY=winY+44;
  ctx.strokeStyle='rgba(180,160,255,0.55)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ccX,ccY,11,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(200,185,255,0.9)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ccX,ccY);ctx.lineTo(ccX+Math.cos(extAngle-Math.PI/2)*8,ccY+Math.sin(extAngle-Math.PI/2)*8);ctx.stroke();
  ctx.strokeStyle='rgba(180,160,255,0.6)';
  ctx.beginPath();ctx.moveTo(ccX,ccY);ctx.lineTo(ccX+Math.cos(extAngle*12-Math.PI/2)*5,ccY+Math.sin(extAngle*12-Math.PI/2)*5);ctx.stroke();

  // external observer figure (fast)
  const extSpd2=tick*(0.08+0.18);
  const eX2=winX+82,eBaseY=winY+winH-14,bob2=4*Math.abs(Math.sin(extSpd2));
  const eC='rgba(200,185,255,0.95)';
  ctx.fillStyle=eC;ctx.beginPath();ctx.arc(eX2,eBaseY-bob2-16,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=eC;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(eX2,eBaseY-bob2-11);ctx.lineTo(eX2,eBaseY-bob2-2);ctx.stroke();
  const sw2=Math.sin(extSpd2)*8;
  ctx.beginPath();ctx.moveTo(eX2-4,eBaseY-bob2-8);ctx.lineTo(eX2+4+sw2,eBaseY-bob2-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX2+4,eBaseY-bob2-8);ctx.lineTo(eX2-4+sw2,eBaseY-bob2-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX2,eBaseY-bob2-2);ctx.lineTo(eX2-5,eBaseY+sw2*0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX2,eBaseY-bob2-2);ctx.lineTo(eX2+5,eBaseY-sw2*0.5);ctx.stroke();
  ctx.fillStyle='rgba(200,185,255,0.85)';ctx.font='6px monospace';ctx.textAlign='center';
  ctx.fillText(`×${Math.min(extClockMult,99)} más rápido`,winX+winW/2,winY+winH-3);

  /* ── STATUS ── */
  // own proper clock (normal)
  const scCX=W-28,scCY=H-34;
  const ownA=tick*0.038;
  ctx.strokeStyle='rgba(255,255,200,0.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(scCX,scCY,12,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,200,0.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(scCX,scCY);ctx.lineTo(scCX+Math.cos(ownA-Math.PI/2)*9,scCY+Math.sin(ownA-Math.PI/2)*9);ctx.stroke();
  ctx.fillStyle='rgba(255,255,200,0.55)';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText('τ nave',scCX,scCY+22);

  /* BLUESHIFT info */
  const uvNm=Math.round(480/blueBoost);
  ctx.fillStyle='rgba(180,160,255,0.85)';ctx.font='7px monospace';ctx.textAlign='right';
  ctx.fillText(`Blueshift ×${blueBoost.toFixed(1)}  λ≈${uvNm}nm`,W-14,H-42);
  ctx.fillText('v = 0  (cohete encendido)',W-14,H-32);

  // spectrum strip — all pushed to blue
  const bx=10,by=H-16,bw=W-20,bh=8;
  const stg=ctx.createLinearGradient(bx,0,bx+bw,0);
  stg.addColorStop(0,'rgba(80,0,160,0.85)');stg.addColorStop(0.25,'rgba(80,80,255,0.85)');
  stg.addColorStop(0.5,'rgba(160,200,255,0.8)');stg.addColorStop(0.75,'rgba(255,255,220,0.6)');
  stg.addColorStop(1,'rgba(255,100,30,0.35)');
  ctx.fillStyle=stg;ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  // pointer near blue end
  const ptrS=bx+bw*0.12;
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(ptrS-1,by-3,2,bh+6);
  ctx.fillStyle='rgba(180,160,255,0.6)';ctx.font='6px monospace';ctx.textAlign='left';
  ctx.fillText('← UV/Azul extremo',bx+2,by-5);

  /* HUD */
  document.getElementById('sl1').textContent='Vel. nave:';
  document.getElementById('sf1').style.width='0%';
  document.getElementById('sf1').style.background='#666';
  document.getElementById('sv1').textContent='0.00c';
  document.getElementById('sl2').textContent='Blueshift:';
  document.getElementById('sf2').style.width=Math.min((blueBoost/5)*100,100).toFixed(0)+'%';
  document.getElementById('sf2').style.background='rgba(120,100,220,1)';
  document.getElementById('sv2').textContent='×'+blueBoost.toFixed(1);
}

/* ── FREEFALL (inertial) ── */
function renderShipFreefall(){
  const p=clamp(tick/CYCLE,0,1);
  const bhCX=W/2, bhCY=H/2;
  const Rs=60;

  // rNorm → 0 = at horizon, use smooth cubic approach
  const rNorm=Math.max(0.001, 1-Math.pow(p,2.5)*0.999);
  const r=Rs*(1+rNorm*4.5);
  // Infall velocity: v/c = √(Rs/r)  (Newtonian approximation of GR freefall)
  const infallV=Math.sqrt(Math.min(1, Rs/r));
  const crossed=p>0.84;

  /* ── BG: darkens and reddens as we approach ── */
  // sky becomes darker and redder — NOT blue (freefall Doppler is red forward)
  const redPhase=clamp(infallV,0,1);
  const bgR=Math.round(lerp(2,18,redPhase)), bgG=Math.round(lerp(2,2,redPhase)), bgB=Math.round(lerp(8,2,redPhase));
  ctx.fillStyle=`rgb(${bgR},${bgG},${bgB})`; ctx.fillRect(0,0,W,H);

  /* ── STARS: aberration + Doppler redshift (freefall) ──
     In freefall toward BH, the special-relativistic Doppler wins over gravity
     near horizon. Light from AHEAD (BH direction) is actually redshifted
     because we're falling INTO it — equivalence principle:
     stars ahead appear compressed to a small bright ring, but redshifted.
     Stars behind disappear (they can barely catch up).
     We model:
      - All stars pushed toward outer halo (aberration: they flee the center)
      - Stars shift to red/infrared as v→c
  ── */
  STARS.forEach(s=>{
    s.twinkle+=0.010;
    const dx=s.baseX-bhCX, dy=s.baseY-bhCY;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=dx/dist, ny=dy/dist;
    // aberration: push stars AWAY from BH center (outer halo)
    const aber=clamp(infallV*infallV,0,0.98);
    const newDist=lerp(dist, dist+(W*0.5-dist)*0.85, aber);
    const sx=bhCX+nx*newDist, sy=bhCY+ny*newDist;
    // Redshift toward infrared
    const rawNm=s.nmBase;
    const redNm=Math.min(800, rawNm*(1+redPhase*1.1));
    let sr,sg,sb;
    if(redNm>750){const d=clamp((redNm-750)/120,0,1);sr=Math.round(lerp(200,20,d));sg=0;sb=0;}
    else{[sr,sg,sb]=wl2rgb(redNm);}
    // stars disappear as sky goes dark
    const bright=Math.max(0,0.35+0.2*Math.sin(s.twinkle)-redPhase*0.28)*clamp(newDist/180,0,1);
    if(sx>0&&sx<W&&sy>0&&sy<H&&bright>0.02){
      ctx.fillStyle=`rgba(${sr},${sg},${sb},${bright})`;
      ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fill();
    }
  });

  /* ── BH SHADOW GROWS as we approach ── */
  const shadowR=Math.min(Rs*(1.2+redPhase*2.8), W*0.7);
  drawBHCore(bhCX,bhCY,Rs,shadowR);

  // photon sphere shimmer
  ctx.strokeStyle=`rgba(255,160,30,${0.3+redPhase*0.4})`;ctx.lineWidth=2+redPhase*3;
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs*1.18,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(220,50,50,0.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bhCX,bhCY,Rs,0,Math.PI*2);ctx.stroke();

  /* ── COCKPIT FRAME ── */
  ctx.strokeStyle='rgba(40,30,30,0.6)';ctx.lineWidth=4;
  const fr=14;
  [[fr,fr,fr+22,fr],[fr,fr,fr,fr+22],[W-fr,fr,W-fr-22,fr],[W-fr,fr,W-fr,fr+22],
   [fr,H-fr,fr+22,H-fr],[fr,H-fr,fr,H-fr-22],[W-fr,H-fr,W-fr-22,H-fr],[W-fr,H-fr,W-fr,H-fr-22]
  ].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});

  /* ── EXTERNAL OBSERVER WINDOW (local time, no acceleration illusion) ── */
  const winW=120,winH=72,winX=12,winY=12;
  ctx.fillStyle='rgba(10,2,2,0.88)';ctx.fillRect(winX,winY,winW,winH);
  ctx.strokeStyle='rgba(180,120,100,0.6)';ctx.lineWidth=1.5;ctx.strokeRect(winX,winY,winW,winH);
  ctx.fillStyle='rgba(210,170,150,0.85)';ctx.font='6.5px monospace';ctx.textAlign='center';
  ctx.fillText('Observador Lejano',winX+winW/2,winY+11);
  // External observer: normal speed (we see no time dilation illusion in freefall)
  const extSpd3=tick*0.055; // normal pace
  const eX3=winX+winW/2, eBase3=winY+winH-14, bob3=4*Math.abs(Math.sin(extSpd3));
  const eC3='rgba(210,170,150,0.9)';
  ctx.fillStyle=eC3;ctx.beginPath();ctx.arc(eX3,eBase3-bob3-16,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=eC3;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(eX3,eBase3-bob3-11);ctx.lineTo(eX3,eBase3-bob3-2);ctx.stroke();
  const sw3=Math.sin(extSpd3)*8;
  ctx.beginPath();ctx.moveTo(eX3-4,eBase3-bob3-8);ctx.lineTo(eX3+4+sw3,eBase3-bob3-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX3+4,eBase3-bob3-8);ctx.lineTo(eX3-4+sw3,eBase3-bob3-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX3,eBase3-bob3-2);ctx.lineTo(eX3-5,eBase3+sw3*0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eX3,eBase3-bob3-2);ctx.lineTo(eX3+5,eBase3-sw3*0.5);ctx.stroke();
  ctx.fillStyle='rgba(210,170,150,0.7)';ctx.font='6px monospace';ctx.textAlign='center';
  ctx.fillText('Tiempo local normal',winX+winW/2,winY+winH-3);

  /* ── CROSSING HORIZON ── */
  if(crossed){
    const cp=clamp((p-0.84)/0.14,0,1);
    ctx.fillStyle=`rgba(30,0,0,${cp*0.7})`; ctx.fillRect(0,0,W,H);
    if(cp>0.25){
      const ta=clamp((cp-0.25)/0.4,0,1);
      ctx.fillStyle=`rgba(180,60,40,${ta*0.88})`;ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('HORIZONTE CRUZADO',W/2,H/2-14);
      ctx.font='7.5px monospace';ctx.fillStyle=`rgba(200,180,170,${ta*0.8})`;
      ctx.fillText('τ propio: continúa normal',W/2,H/2+4);
      ctx.fillText('Sin sensación especial localmente',W/2,H/2+18);
      ctx.fillStyle=`rgba(160,80,60,${ta*0.7})`;ctx.font='7px monospace';
      ctx.fillText('Singularidad en r = 0  (adelante)',W/2,H/2+34);
    }
  }

  /* ── REDSHIFT + ABERRATION LABELS ── */
  if(redPhase>0.15){
    const rp=clamp((redPhase-0.15)/0.3,0,1);
    const redNm2=Math.round(lerp(580,820,redPhase));
    ctx.fillStyle=`rgba(200,120,90,${rp*0.9})`;ctx.font='7px monospace';ctx.textAlign='right';
    ctx.fillText(`Redshift: λ≈${redNm2}nm`,W-14,H-44);
    ctx.fillText(`Aberración: ${Math.round(infallV*68)}°`,W-14,H-34);
    ctx.fillText(`v ≈ ${infallV.toFixed(3)}c`,W-14,H-24);
  }

  /* ── SPECTRUM STRIP (moves toward red) ── */
  const bx=10,by=H-16,bw=W-20,bh=8;
  const stg2=ctx.createLinearGradient(bx,0,bx+bw,0);
  stg2.addColorStop(0,'rgba(80,80,255,0.5)');stg2.addColorStop(0.3,'rgba(255,255,255,0.7)');
  stg2.addColorStop(0.55,'rgba(255,200,60,0.8)');stg2.addColorStop(0.75,'rgba(255,60,10,0.85)');
  stg2.addColorStop(1,'rgba(20,0,0,0.75)');
  ctx.fillStyle=stg2;ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  const ptr2=bx+bw*clamp(0.3+redPhase*0.65,0,1);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(ptr2-1,by-3,2,bh+6);
  ctx.fillStyle='rgba(180,120,100,0.55)';ctx.font='6px monospace';ctx.textAlign='right';
  ctx.fillText('Rojo → IR →',bx+bw-2,by-5);

  /* OWN CLOCK */
  const scCX=W-28,scCY=H-34,ownA2=tick*0.038;
  ctx.strokeStyle='rgba(255,220,200,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(scCX,scCY,12,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,220,200,0.7)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(scCX,scCY);ctx.lineTo(scCX+Math.cos(ownA2-Math.PI/2)*9,scCY+Math.sin(ownA2-Math.PI/2)*9);ctx.stroke();
  ctx.fillStyle='rgba(255,220,200,0.45)';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText('τ nave',scCX,scCY+22);

  /* HUD */
  document.getElementById('sl1').textContent='Vel. caída:';
  document.getElementById('sf1').style.width=(infallV*100).toFixed(1)+'%';
  document.getElementById('sf1').style.background=`rgba(${Math.round(200+redPhase*55)},${Math.round(80-redPhase*80)},${Math.round(40-redPhase*40)},1)`;
  document.getElementById('sv1').textContent=infallV.toFixed(3)+'c';
  document.getElementById('sl2').textContent='Longitud onda:';
  const nm2=Math.round(lerp(580,820,redPhase));
  document.getElementById('sf2').style.width=(redPhase*100).toFixed(0)+'%';
  document.getElementById('sf2').style.background=`rgba(${Math.round(200+redPhase*55)},${Math.round(60-redPhase*60)},0,1)`;
  document.getElementById('sv2').textContent=nm2+'nm';
}

      {t:'Fase 3 — Desvanecimiento',
       b:'La nave pierde luminosidad L_obs → 0. La opacidad baja linealmente de 100% a 0. La nave se hace fantasma y desaparece. El ciclo reinicia suavemente.'},
    ],
    legend:[
      {c:'#a8c8ff',l:'Blanco-azul (lejos, λ≈480nm)'},
      {c:'#ffdd44',l:'Amarillo (λ≈580nm)'},
      {c:'#ff6622',l:'Naranja (λ≈650nm)'},
      {c:'#aa0000',l:'Rojo-IR (λ≈800nm+, congelado)'},
    ]
  },
  {
    formulas:[
      {n:'Blueshift grav.:',v:'<span class="b">f_obs=f_emit/√(1−Rs/r)  (motores enc.)</span>'},
      {n:'Caída libre v:',  v:'<span class="r">v/c ≈ √(Rs/r)  (Schwarzschild ff)</span>'},
      {n:'Aberración:',     v:'<span class="g">cosθ\'=(cosθ−v/c)/(1−v·cosθ/c)</span>'},
      {n:'Redshift ff:',    v:'<span class="r">f_ff = f_emit·√(1−Rs/r)/(1+v·cosθ/c)</span>'},
      {n:'Tiempo propio:',  v:'<span class="p">τ cruza Rs en tiempo FINITO</span>'},
    ],
    info:[
      {t:'Motores encendidos — Blueshift extremo',
       b:'Estacionario a r=1.18·Rs. El cohete quema combustible luchando contra la gravedad. No hay velocidad propia, pero la energía gravitacional azulea y comprime el espectro. El reloj externo gira rápido (dilatación temporal gravitacional).'},
      {t:'Caída libre — Redshift + Aberración',
       b:'En caída libre inercial, el principio de equivalencia reduce el efecto gravitacional. Domina el Doppler cinemático. v → c → las estrellas se empujan hacia el halo exterior (aberración) y se enrojecen. El cielo se oscurece al cruzar Rs.'},
    ],
    legend:[
      {c:'rgba(140,100,220,0.9)',l:'Blueshift UV (motores enc.)'},
      {c:'rgba(180,160,255,0.8)',l:'Anillo Einstein (lensing)'},

      {c:'rgba(220,50,50,0.7)',l:'Horizonte Rs'},

const NOTES=[
  '<strong>¿Por qué no cruza?</strong> Para el observador lejano, t→∞ cuando r→Rs. La nave emite fotones cada vez más espaciados y rojos. Su luminosidad L→0. La nave <em>desaparece</em> sin cruzar. En tiempo propio τ sí cruza, pero ese fotón nunca llega.',
  '<strong>Motores enc.:</strong> Hovering cerca del horizonte implica blueshift extremo y aceleración del reloj externo. Gravedad pura, sin velocidad.<br><strong>Caída libre:</strong> El astronauta <em>no siente</em> nada especial en Rs si el BH es grande. Las estrellas se enrojecen y huyen al halo. La singularidad en r=0 es lo que destruye.'
];

function populatePanel(){
  const d=TDATA[obsMode];
  let h='<div class="flabel">Fórmulas clave</div>';
  d.formulas.forEach(f=>{h+=`<div class="frow"><span class="fn">${f.n}</span><span class="fv">${f.v}</span></div>`;});
  document.getElementById('fPanel').innerHTML=h;
  let lh='';d.legend.forEach(l=>{lh+=`<div class="li"><div class="ld" style="background:${l.c}"></div>${l.l}</div>`;});
  document.getElementById('legBox').innerHTML=lh;
  document.getElementById('noteEl').innerHTML=NOTES[obsMode];
  setInfo(0);
}
function setInfo(i){
  const arr=TDATA[obsMode].info;
  const d=arr[Math.min(i,arr.length-1)];
  document.getElementById('iBox').innerHTML=`<div class="it">● ${d.t}</div>${d.b}`;
}

/* ══════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════ */
function frame(){
  ctx.clearRect(0,0,W,H);
  if(obsMode===0){
    renderExternal();
  } else {
    if(flightMode===0) renderShipStationary();
    else               renderShipFreefall();
  }
  const p=clamp(tick/CYCLE,0,1);
  if(running){
    const iIdx = p<0.35?0:p<0.70?1:2;
    setInfo(Math.min(iIdx, TDATA[obsMode].info.length-1));
    tick=(tick+1)%(CYCLE+60);
    raf=requestAnimationFrame(frame);
  }
}

/* ══════════════════════════════════════
   CONTROLS
══════════════════════════════════════ */
function setObs(i){
  obsMode=i; tick=0; photons=[];
  document.getElementById('ob0').classList.toggle('active',i===0);
  document.getElementById('ob1').classList.toggle('active',i===1);
  document.getElementById('flightMenu').classList.toggle('visible',i===1);
  populatePanel();
  if(!running) frame();
}

function setFlight(i){
  flightMode=i; tick=0;
  document.getElementById('fm0').classList.toggle('active',i===0);
  document.getElementById('fm1').classList.toggle('active',i===1);
  // update info panel for sub-mode
  setInfo(i===0?0:1);
}

function doToggle(){
  running=!running;
  const b=document.getElementById('btnPlay');
  b.textContent=running?'⏸ Pausar':'▶ Animar';
  b.classList.toggle('on',running);
  if(running) frame();
}
function doReset(){
  tick=0; photons=[]; running=true;
  document.getElementById('btnPlay').textContent='⏸ Pausar';
  document.getElementById('btnPlay').classList.add('on');
  populatePanel(); frame();
}
function doStep(){
  if(running){doToggle();return;}
  tick=Math.min(tick+Math.floor(CYCLE/7),CYCLE-1);
  const p=clamp(tick/CYCLE,0,1);
  setInfo(p<0.35?0:p<0.70?1:2);
  frame();
}

/* INIT */
setObs(0); frame();
</script>
